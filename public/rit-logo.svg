<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Shield Background -->
  <defs>
    <linearGradient id="ritShieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="50%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Base Soft Rounded Card -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Shield -->
  <path d="M50 14 C68 14 78 20 78 40 C78 64 50 82 50 82 C50 82 22 64 22 40 C22 20 32 14 50 14 Z" 
        fill="url(#ritShieldGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Sun Rays / Dawn of Knowledge -->
  <path d="M50 24 L50 20 M42 27 L39 24 M58 27 L61 24" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="30" r="4" fill="url(#goldGrad)"/>

  <!-- Open Book of Learning -->
  <path d="M34 46 C41 43 47 45 50 49 C53 45 59 43 66 46 L66 58 C59 55 53 57 50 61 C47 57 41 55 34 58 Z" 
        fill="#ffffff" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="50" y1="49" x2="50" y2="61" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Industrial Gear / Tech Element -->
  <circle cx="50" cy="71" r="5" stroke="url(#goldGrad)" stroke-width="2" fill="none" stroke-dasharray="2 1.5"/>
</svg>
